<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CA Digital | Gestão</title><style>:root{--l:#8562bd;--p:#f7f4fc;--b:#e8def5;--t:#322640}*{box-sizing:border-box}body{margin:0;font:14px system-ui,Arial;background:var(--p);color:var(--t)}header{background:white;border-bottom:1px solid var(--b);padding:17px 5%;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}small,.muted{color:#82768e}.shell{max-width:1120px;margin:auto;padding:22px 16px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}button,.btn{border:0;background:var(--l);color:white;padding:11px 15px;border-radius:11px;cursor:pointer;font:inherit}button.secondary{background:white;color:var(--l);border:1px solid var(--b)}.nav button{background:white;color:#71598e}.nav button.active{background:var(--l);color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.card,.panel{background:white;border:1px solid var(--b);border-radius:17px;padding:18px;box-shadow:0 4px 18px #68517a09}.card strong{font-size:25px;display:block;margin-top:9px}.panel{margin-top:17px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h2{font-size:19px;margin:0 0 14px}input,select,textarea{width:100%;padding:11px;border:1px solid #dcd1ea;border-radius:10px;background:#fff;font:inherit;color:var(--t)}label{display:block;font-weight:600;font-size:12px;margin:12px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}.item{border-top:1px solid #eee7f7;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#eee7fa;color:#6d5099;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none}.notice{background:#f2ebfc;padding:12px;border-radius:10px;color:#624a87;margin:12px 0}.danger{color:#a43154}.modal{position:fixed;inset:0;background:#21192d99;display:none;align-items:center;justify-content:center;padding:15px;z-index:3}.modal.show{display:flex}.dialog{background:white;max-width:680px;width:100%;max-height:92vh;overflow:auto;border-radius:19px;padding:23px}.right{text-align:right}.empty{color:#867a90;padding:24px;text-align:center}.preview{white-space:pre-wrap;line-height:1.6;background:#fcfbfe;border:1px solid var(--b);border-radius:12px;padding:20px}.brand{color:var(--l);font-weight:800}footer{text-align:center;padding:30px;color:#8b7e99}@media(max-width:550px){header{padding:15px}.shell{padding:14px}.card strong{font-size:21px}.dialog{padding:16px}}
.signcanvas{width:100%;height:180px;border:2px dashed #c5b0e2;border-radius:12px;touch-action:none;background:white}.signwrap{max-width:760px;margin:20px auto;padding:24px;background:white;border-radius:20px;border:1px solid #e8def5}.signwrap h2{color:#65468d}.signwrap p{line-height:1.65}.signbox{background:#f8f5fd;padding:18px;border-radius:12px;white-space:pre-wrap;line-height:1.7}.signed{background:#e8f7ed;color:#23683a;padding:12px;border-radius:12px;margin:12px 0}.warn{background:#fff4df;color:#80560e;padding:12px;border-radius:12px;margin:12px 0}
</style></head><body><header><div><div class="brand">CA DIGITAL</div><small>Contratos • Cobranças • Projetos</small></div><button class="secondary" onclick="backup()">Exportar backup</button></header><main class="shell"><nav class="nav" id="nav"></nav><div id="view"></div></main><footer>Versão demonstrativa • Dados salvos somente neste navegador • Assinaturas não têm validação jurídica integrada</footer><div class="modal" id="modal"><div class="dialog"><div class="toolbar"><h2 id="modalTitle"></h2><button class="secondary" onclick="closeModal()">Fechar ✕</button></div><div id="modalBody"></div></div></div><script>
const KEY='cadigital_crm_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"clients":[],"contracts":[],"projects":[],"payments":[]}');let tab='Painel';const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const today=()=>new Date().toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function showModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function go(t){tab=t;render()}const btn=(label,fn,secondary=false)=>`<button class="${secondary?'secondary':''}" onclick="${fn}">${label}</button>`;const field=(label,name,type='text',value='',extra='')=>`<div><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;function formData(form){return Object.fromEntries(new FormData(form).entries())}function nameFor(id){return db.clients.find(c=>c.id===id)?.name||'Cliente removido'}function render(){document.getElementById('nav').innerHTML=['Painel','Clientes','Contratos','Cobranças','Projetos futuros'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('');const v=document.getElementById('view');if(tab==='Painel'){let received=db.payments.filter(p=>p.paid).reduce((a,p)=>a+Number(p.value),0),pending=db.payments.filter(p=>!p.paid).reduce((a,p)=>a+Number(p.value),0);v.innerHTML=`<h2>Visão geral</h2><div class="cards"><div class="card">Clientes cadastrados<strong>${db.clients.length}</strong></div><div class="card">Contratos cadastrados<strong>${db.contracts.length}</strong></div><div class="card">Recebido (registrado)<strong>${money(received)}</strong></div><div class="card">A receber (lançado)<strong>${money(pending)}</strong></div><div class="card">Projetos futuros<strong>${db.projects.filter(p=>p.status!=='Concluído').length}</strong></div></div><section class="panel"><h2>Comece por aqui</h2><p>Cadastre o cliente, crie o contrato e lance os vencimentos. Em seguida, acompanhe cobranças e projetos futuros.</p><div class="actions">${btn('+ Cliente','clientModal()')}${btn('+ Contrato','contractModal()')}${btn('+ Projeto futuro','projectModal()')}</div><div class="notice">O controle é independente do seu financeiro pessoal. Valores de contratos não são contados como recebidos até você dar baixa no pagamento.</div></section>`}if(tab==='Clientes'){v.innerHTML=`<div class="toolbar"><h2>Clientes</h2>${btn('+ Novo cliente','clientModal()')}</div><section class="panel">${db.clients.length?db.clients.map(c=>`<div class="item"><div><b>${esc(c.name)}</b><br><small>${esc(c.phone)} • ${esc(c.email)}</small></div><div class="actions">${btn('Editar',`clientModal('${c.id}')`,true)}${btn('Excluir',`del('clients','${c.id}')`,true)}</div></div>`).join(''):'<div class="empty">Nenhum cliente cadastrado.</div>'}</section>`}if(tab==='Contratos'){v.innerHTML=`<div class="toolbar"><h2>Contratos</h2>${btn('+ Novo contrato','contractModal()')}</div><section class="panel">${db.contracts.length?db.contracts.map(c=>`<div class="item"><div><b>${esc(nameFor(c.client))}</b> <span class="pill">${esc(c.type)}</span><br><small>${esc(c.service)} • ${money(c.value)} ${c.type==='Mensal'?'por mês':''} • ${esc(c.status)} ${c.type==='Parcelado'?'• '+db.payments.filter(p=>p.contract===c.id&&p.installmentNumber&&p.paid).length+'/'+(c.installments||'?')+' parcelas pagas • Falta '+money(db.payments.filter(p=>p.contract===c.id&&p.installmentNumber&&!p.paid).reduce((a,p)=>a+Number(p.value),0)):''}</small></div><div class="actions">${btn('Visualizar',`preview('${c.id}')`,true)}${btn('Editar',`contractModal('${c.id}')`,true)}${btn('Excluir',`del('contracts','${c.id}')`,true)}</div></div>`).join(''):'<div class="empty">Nenhum contrato cadastrado.</div>'}</section>`}if(tab==='Cobranças'){let arr=[...db.payments].sort((a,b)=>a.due.localeCompare(b.due));v.innerHTML=`<div class="toolbar"><h2>Cobranças e recebimentos</h2>${btn('+ Lançar cobrança','paymentModal()')}</div><div class="notice">Mensalidades são lançadas individualmente para cada vencimento. O aplicativo não envia mensagens automaticamente e não processa pagamentos.</div><section class="panel">${arr.length?arr.map(p=>{let c=db.contracts.find(x=>x.id===p.contract),phone=db.clients.find(x=>x.id===c?.client)?.phone||'',msg=`Olá! Tudo bem? Passando para lembrar do pagamento referente a ${c?.service||'serviço contratado'}, no valor de ${money(p.value)}, com vencimento em ${new Date(p.due+'T12:00:00').toLocaleDateString('pt-BR')}. Qualquer dúvida, estou à disposição. CA Digital`;return `<div class="item"><div><b>${esc(nameFor(c?.client))}</b> <span class="pill">${p.paid?'Pago':p.due<today()?'Atrasado':'Pendente'}</span><br><small>${esc(c?.service)} ${p.installmentNumber?'• Parcela '+p.installmentNumber+'/'+(c?.installments||'?'):''} • ${money(p.value)} • Vence ${new Date(p.due+'T12:00:00').toLocaleDateString('pt-BR')}</small></div><div class="actions">${btn(p.paid?'Desfazer baixa':'Marcar pago',`togglePaid('${p.id}')`,true)}${btn('Cobrar WhatsApp',`whats('${p.id}')`,true)}${btn('Excluir',`del('payments','${p.id}')`,true)}</div></div>`}).join(''):'<div class="empty">Nenhuma cobrança lançada.</div>'}</section>`}if(tab==='Projetos futuros'){v.innerHTML=`<div class="toolbar"><h2>Projetos futuros e lembretes</h2>${btn('+ Novo projeto','projectModal()')}</div><section class="panel">${db.projects.length?db.projects.map(p=>`<div class="item"><div><b>${esc(p.title)}</b> <span class="pill">${esc(p.status)}</span><br><small>${esc(p.prospect||nameFor(p.client))} • ${esc(p.service||'Projeto')} • ${esc(p.phone||'Sem WhatsApp')} • Lembrar em ${p.date?new Date(p.date+'T12:00:00').toLocaleDateString('pt-BR'):'data não definida'}</small><p>${esc(p.notes)}</p></div><div class="actions">${btn('WhatsApp',`prospectWhats('${p.id}')`,true)}${btn('Virar cliente',`convertProspect('${p.id}')`,true)}${btn('Editar',`projectModal('${p.id}')`,true)}${btn('Excluir',`del('projects','${p.id}')`,true)}</div></div>`).join(''):'<div class="empty">Nenhuma oportunidade cadastrada. Cadastre interessados mesmo que ainda não tenham fechado contrato.</div>'}</section>`}}
function clientModal(i){let c=db.clients.find(x=>x.id===i)||{};showModal(i?'Editar cliente':'Novo cliente',`<form onsubmit="clientSave(event,'${i||''}')"><div class="formgrid">${field('Nome / empresa','name','text',c.name,'required')}${field('WhatsApp com DDD','phone','tel',c.phone)}${field('E-mail','email','email',c.email)}${field('CPF/CNPJ (opcional)','document','text',c.document)}</div><p class="right"><button>Salvar cliente</button></p></form>`)}function clientSave(e,i){e.preventDefault();let c={...formData(e.target),id:i||id()};db.clients=i?db.clients.map(x=>x.id===i?c:x):[...db.clients,c];closeModal();save()}
function contractModal(i){if(!db.clients.length){alert('Cadastre um cliente primeiro.');go('Clientes');return}let c=db.contracts.find(x=>x.id===i)||{};showModal(i?'Editar contrato':'Novo contrato',`<form onsubmit="contractSave(event,'${i||''}')"><div class="formgrid"><div><label>Cliente</label><select name="client" required>${db.clients.map(x=>`<option value="${x.id}" ${c.client===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label>Tipo</label><select name="type" onchange="toggleInstallmentFields(this.form)">${['Único','Parcelado','Mensal'].map(t=>`<option ${c.type===t?'selected':''}>${t}</option>`).join('')}</select></div>${field('Serviço / projeto','service','text',c.service,'required')}${field('Valor (R$)','value','number',c.value||'', 'min="0" step="0.01" required')}<div class="installment-only" style="display:${c.type==='Parcelado'?'block':'none'}">${field('Quantidade de parcelas','installments','number',c.installments||2,'min="1" max="120"')}</div><div class="installment-only" style="display:${c.type==='Parcelado'?'block':'none'}">${field('Vencimento da primeira parcela','firstDue','date',c.firstDue||c.start||today())}</div>${field('Dia de vencimento mensal (1 a 28)','day','number',c.day||10,'min="1" max="28"')}${field('Data de início','start','date',c.start||today())}<div><label>Status</label><select name="status">${['Rascunho','Enviado','Assinado (confirmado externamente)','Ativo','Encerrado'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><label>Condições / observações</label><textarea name="notes" rows="4">${esc(c.notes||'')}</textarea><div class="notice">O documento gerado é um resumo demonstrativo. Para assinatura eletrônica válida e compartilhamento com clientes, será necessária uma integração e publicação online.</div><p class="right"><button>Salvar contrato</button></p></form>`)}function toggleInstallmentFields(form){let show=form.elements.type.value==='Parcelado';form.querySelectorAll('.installment-only').forEach(el=>el.style.display=show?'block':'none');form.elements.installments.required=show;form.elements.firstDue.required=show}
function addMonths(iso,n){let [y,m,d]=iso.split('-').map(Number);let base=new Date(y,m-1+n,1);let last=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();return [base.getFullYear(),String(base.getMonth()+1).padStart(2,'0'),String(Math.min(d,last)).padStart(2,'0')].join('-')}
function contractSave(e,i){e.preventDefault();let old=db.contracts.find(x=>x.id===i)||{};let c={...old,...formData(e.target),id:i||id()};if(c.type==='Parcelado'){let count=Number(c.installments);if(!Number.isInteger(count)||count<1||count>120||!c.firstDue)return alert('Informe quantidade de parcelas e primeiro vencimento.');let existing=db.payments.filter(p=>p.contract===c.id&&p.installmentNumber);if(existing.length&& (Number(old.installments)!==count||Number(old.value)!==Number(c.value)||old.firstDue!==c.firstDue)){if(!confirm('Alterar parcelas recriará apenas parcelas ainda não pagas. As parcelas pagas serão preservadas. Continuar?'))return;db.payments=db.payments.filter(p=>!(p.contract===c.id&&p.installmentNumber&&!p.paid))}let cents=Math.round(Number(c.value)*100),base=Math.floor(cents/count);for(let n=1;n<=count;n++){if(db.payments.some(p=>p.contract===c.id&&Number(p.installmentNumber)===n))continue;let amount=(base+(n===count?cents-base*count:0))/100;db.payments.push({id:id(),contract:c.id,value:amount,due:addMonths(c.firstDue,n-1),paid:false,installmentNumber:n,notes:'Parcela '+n+'/'+count})}}db.contracts=i?db.contracts.map(x=>x.id===i?c:x):[...db.contracts,c];closeModal();save()}

function preview(i){let c=db.contracts.find(x=>x.id===i),cl=db.clients.find(x=>x.id===c.client);let content=`CA DIGITAL — RESUMO DE CONTRATAÇÃO (DEMONSTRAÇÃO)\n\nContratante: ${cl.name}\nDocumento: ${cl.document||'Não informado'}\nServiço: ${c.service}\nModalidade: ${c.type}\nValor: ${money(c.value)} ${c.type==='Mensal'?'por mês':''}\n${c.type==='Parcelado'?'Parcelamento: '+c.installments+' vezes, primeira parcela em '+c.firstDue:'Vencimento mensal: dia '+(c.day||'a definir')}\nInício previsto: ${c.start||'a definir'}\nCondições: ${c.notes||'A definir entre as partes'}\n\nEste resumo não substitui contrato jurídico completo nem constitui assinatura eletrônica.`;showModal('Prévia do contrato',`<div class="preview">${esc(content)}</div><p class="actions">${btn('Imprimir / Salvar PDF','window.print()',true)}${btn('Copiar texto',`copyContract('${i}')`)}</p>`)}function copyContract(i){let c=db.contracts.find(x=>x.id===i);navigator.clipboard.writeText(`CA Digital - ${nameFor(c.client)} - ${c.service} - ${c.type} - ${money(c.value)} - ${c.notes||''}`).then(()=>alert('Resumo copiado.'))}
function paymentModal(){if(!db.contracts.length){alert('Cadastre um contrato primeiro.');go('Contratos');return}showModal('Nova cobrança',`<form onsubmit="paymentSave(event)"><div><label>Contrato</label><select name="contract">${db.contracts.map(c=>`<option value="${c.id}">${esc(nameFor(c.client))} — ${esc(c.service)}</option>`).join('')}</select></div><div class="formgrid">${field('Valor da cobrança (R$)','value','number','','required min="0.01" step="0.01"')}${field('Vencimento','due','date',today(),'required')}</div><label>Observação</label><input name="notes"><p class="right"><button>Salvar cobrança</button></p></form>`)}function paymentSave(e){e.preventDefault();db.payments.push({...formData(e.target),id:id(),paid:false});closeModal();save()}function togglePaid(i){let p=db.payments.find(x=>x.id===i);p.paid=!p.paid;p.paidAt=p.paid?today():null;save()}function whats(i){let p=db.payments.find(x=>x.id===i),c=db.contracts.find(x=>x.id===p.contract),cl=db.clients.find(x=>x.id===c.client),phone=(cl.phone||'').replace(/\D/g,'');if(!phone){alert('Cadastre o WhatsApp do cliente.');return}if(phone.length===10||phone.length===11)phone='55'+phone;let msg=`Olá, ${cl.name}! Tudo bem? Passando para lembrar do pagamento referente a ${c.service}, no valor de ${money(p.value)}, com vencimento em ${new Date(p.due+'T12:00:00').toLocaleDateString('pt-BR')}. Qualquer dúvida, estou à disposição. CA Digital`;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank')}
function projectModal(i){let p=db.projects.find(x=>x.id===i)||{};showModal(i?'Editar oportunidade':'Nova oportunidade / projeto futuro',`<form onsubmit="projectSave(event,'${i||''}')"><div class="notice">Cadastre aqui qualquer pessoa ou empresa interessada, mesmo sem contrato e sem cadastro na aba Clientes.</div><div class="formgrid">${field('Nome da pessoa ou empresa','prospect','text',p.prospect|| (p.client?nameFor(p.client):''),'required')}${field('WhatsApp com DDD','phone','tel',p.phone||'','placeholder="64999999999"')}<div><label>Serviço de interesse</label><select name="service">${['Site','Sistema de gestão','Cardápio digital','Automação','Aplicativo','Redes sociais','Outro'].map(t=>`<option ${p.service===t?'selected':''}>${t}</option>`).join('')}</select></div>${field('Nome do projeto','title','text',p.title||'','placeholder="Ex.: Site da pousada" required')}${field('Data para lembrar','date','date',p.date||today())}<div><label>Situação</label><select name="status">${['Interessado','Contatar depois','Orçamento enviado','Negociando','Fechado','Desistiu','Concluído'].map(t=>`<option ${p.status===t?'selected':''}>${t}</option>`).join('')}</select></div></div><label>Anotações</label><textarea name="notes" rows="4">${esc(p.notes||'')}</textarea><p class="right"><button>Salvar oportunidade</button></p></form>`)}function projectSave(e,i){e.preventDefault();let old=db.projects.find(x=>x.id===i)||{};let p={...old,...formData(e.target),id:i||id()};db.projects=i?db.projects.map(x=>x.id===i?p:x):[...db.projects,p];closeModal();save()}function prospectWhats(i){let p=db.projects.find(x=>x.id===i);if(!p)return;let phone=(p.phone||'').replace(/\D/g,'');if(phone.length===10||phone.length===11)phone='55'+phone;if(!phone){alert('Cadastre o WhatsApp dessa pessoa primeiro.');return}let msg='Olá, '+(p.prospect||'')+'! Tudo bem? Estou entrando em contato para conversarmos sobre '+(p.title||p.service||'seu projeto')+'. CA Digital';window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank')}function convertProspect(i){let p=db.projects.find(x=>x.id===i);if(!p)return;let existing=db.clients.find(c=>c.name.trim().toLowerCase()===(p.prospect||'').trim().toLowerCase());if(!existing){existing={id:id(),name:p.prospect||'Novo cliente',phone:p.phone||'',email:'',document:''};db.clients.push(existing)}p.client=existing.id;p.status='Fechado';save();alert('Cliente adicionado à aba Clientes. Agora você pode criar o contrato.')}function del(type,i){if(!confirm('Deseja excluir este registro?'))return;if(type==='clients'&&(db.contracts.some(c=>c.client===i)||db.projects.some(p=>p.client===i))){alert('Este cliente tem contratos ou projetos vinculados.');return}if(type==='contracts'&&db.payments.some(p=>p.contract===i)){alert('Exclua primeiro as cobranças deste contrato.');return}db[type]=db[type].filter(x=>x.id!==i);save()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-ca-digital-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
// Assinatura demonstrativa: arquivo compartilhável e retorno manual; não substitui provedor de assinatura.
function contractText(c,cl){return `INSTRUMENTO DE PRESTAÇÃO DE SERVIÇOS — MINUTA PARA CONFERÊNCIA\n\nPRESTADORA: CA Digital (dados completos da prestadora devem ser incluídos no contrato definitivo).\nCONTRATANTE: ${cl?.name||'Não identificado'}\nCPF/CNPJ: ${cl?.document||'Não informado'}\n\nSERVIÇO: ${c.service||'Não informado'}\nMODALIDADE: ${c.type||'Não informado'}\nVALOR: ${money(c.value)}${c.type==='Mensal'?' por mês':''}\nDATA DE INÍCIO: ${c.start||'A definir'}\nVENCIMENTO: ${c.type==='Mensal'?'Escolhido pelo contratante abaixo':c.type==='Parcelado'?c.installments+' parcelas mensais a partir de '+c.firstDue:'Conforme acordado'}\n\nCONDIÇÕES E ESCOPO INFORMADOS:\n${c.notes||'Condições não preenchidas. É necessário detalhar escopo, prazo, obrigações, cancelamento e suporte antes de contratar.'}\n\nEsta é uma MINUTA DEMONSTRATIVA. Confira e complete todos os termos antes de utilizá-la como contrato real.`}
function sendSign(i){let c=db.contracts.find(x=>x.id===i);if(!c)return;let url=location.href.split('#')[0]+'#assinar='+encodeURIComponent(i);showModal('Enviar para assinatura',`<div class="notice">Demonstração local: o link só encontrará o contrato neste mesmo navegador. Para um cliente abrir em outro celular, será necessário publicar a plataforma com banco de dados e autenticação.</div><label>Link de demonstração</label><input readonly value="${esc(url)}" id="signurl"><p class="actions"><button onclick="navigator.clipboard.writeText(document.getElementById('signurl').value).then(()=>alert('Link copiado'))" type="button">Copiar link</button><button class="secondary" onclick="closeModal();location.hash='assinar=${encodeURIComponent(i)}';clientSignPage()">Testar como cliente</button></p><p class="muted">Para testar com outra pessoa sem banco de dados, use o botão “Exportar proposta para assinatura”, envie o arquivo HTML e peça que ela devolva o comprovante gerado.</p><button onclick="exportProposal('${i}')">Exportar proposta para assinatura</button>`)}
function exportProposal(i){let c=db.contracts.find(x=>x.id===i),cl=db.clients.find(x=>x.id===c.client);let payload=JSON.stringify({contract:c,client:cl}).replace(/</g,'\\u003c');let html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assinar proposta | CA Digital</title></head><body><script>window.__CA_PROPOSAL__=${payload};<\/script>${document.documentElement.outerHTML.match(/<style>[\s\S]*?<\/style>/)?.[0]||''}<main id="standalone"></main><script>${clientPageSource()}<\/script></body></html>`;downloadBlob(html,'proposta-ca-digital.html','text/html')}
function clientPageSource(){return `const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});${contractText.toString()};${downloadBlob.toString()};${clientUI.toString()};${setupCanvas.toString()};${finishSign.toString()};clientUI(window.__CA_PROPOSAL__.contract,window.__CA_PROPOSAL__.client,true);`}
function downloadBlob(data,name,type){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function clientSignPage(){let i=decodeURIComponent(location.hash.split('assinar=')[1]||'');let c=db.contracts.find(x=>x.id===i);if(!c){alert('Contrato não encontrado neste navegador. Para compartilhar entre dispositivos, é necessário banco de dados.');location.hash='';return}document.querySelector('header').style.display='none';document.querySelector('footer').style.display='none';document.querySelector('.shell').style.display='none';let root=document.getElementById('clientSigningRoot');if(!root){root=document.createElement('div');root.id='clientSigningRoot';document.body.append(root)}root.style.display='block';clientUI(c,db.clients.find(x=>x.id===c.client),false)}
function clientUI(c,cl,standalone){let root=standalone?document.getElementById('standalone'):document.getElementById('clientSigningRoot');root.innerHTML=`<div class="signwrap"><div class="brand">CA DIGITAL</div><h2>Assinatura de contrato</h2><p>Olá, <strong>${String(cl?.name||'Cliente').replace(/</g,'&lt;')}</strong>. Leia todos os termos antes de confirmar.</p><div class="signbox" id="terms"></div><div class="warn">Versão de demonstração. A assinatura desenhada e o arquivo de comprovante não têm verificação de identidade nem trilha de auditoria certificada.</div>${c.type==='Mensal'?`<label>Escolha o dia de vencimento mensal</label><select id="chosenDay">${[5,10,15,20,25,28].map(d=>`<option value="${d}" ${Number(c.day)===d?'selected':''}>Dia ${d}</option>`).join('')}</select>`:''}<label>Nome completo de quem assina</label><input id="signer" placeholder="Digite seu nome completo"><label>CPF/CNPJ do assinante</label><input id="signerDoc" placeholder="CPF ou CNPJ"><label>Desenhe sua assinatura no espaço abaixo</label><canvas class="signcanvas" id="signature" width="700" height="180"></canvas><p><button class="secondary" onclick="setupCanvas(true)">Limpar assinatura</button></p><label style="font-weight:normal"><input type="checkbox" id="consent" style="width:auto"> Li e concordo com os termos apresentados nesta minuta</label><p><button onclick="finishSign()">Confirmar assinatura e gerar comprovante</button></p><div id="signresult"></div>${standalone?'':'<p><button class="secondary" onclick="location.hash=\'\';location.reload()">Voltar ao painel</button></p>'}</div>`;document.getElementById('terms').textContent=contractText(c,cl);window.__currentSign={contract:c,client:cl};setupCanvas(false)}
function setupCanvas(clear){let can=document.getElementById('signature'),ctx=can.getContext('2d');if(clear)ctx.clearRect(0,0,can.width,can.height);ctx.strokeStyle='#563579';ctx.lineWidth=2.5;ctx.lineCap='round';let drawing=false;can.onpointerdown=e=>{drawing=true;can.setPointerCapture(e.pointerId);ctx.beginPath();let r=can.getBoundingClientRect();ctx.moveTo((e.clientX-r.left)*can.width/r.width,(e.clientY-r.top)*can.height/r.height);window.__hasInk=true};can.onpointermove=e=>{if(!drawing)return;let r=can.getBoundingClientRect();ctx.lineTo((e.clientX-r.left)*can.width/r.width,(e.clientY-r.top)*can.height/r.height);ctx.stroke()};can.onpointerup=()=>drawing=false;if(clear)window.__hasInk=false}
function finishSign(){let signer=document.getElementById('signer').value.trim(),doc=document.getElementById('signerDoc').value.trim();if(signer.length<5||doc.length<5||!document.getElementById('consent').checked||!window.__hasInk){alert('Preencha nome, documento, aceite os termos e desenhe a assinatura.');return}let c=window.__currentSign.contract,cl=window.__currentSign.client;let proof={version:1,contractId:c.id,clientId:cl?.id,clientName:cl?.name,service:c.service,type:c.type,value:c.value,terms:contractText(c,cl),signer,document:doc,day:c.type==='Mensal'?document.getElementById('chosenDay').value:null,signedAt:new Date().toISOString(),signature:document.getElementById('signature').toDataURL('image/png'),method:'assinatura desenhada - demonstração sem verificação'};downloadBlob(JSON.stringify(proof,null,2),'assinatura-'+(c.id||'contrato')+'.json','application/json');document.getElementById('signresult').innerHTML='<div class="signed">Assinatura registrada nesta demonstração. O comprovante JSON foi baixado. Envie o arquivo à CA Digital para registrar no painel.</div>';document.querySelector('.signwrap button[onclick="finishSign()"]')?.setAttribute('disabled','true')}
function importProof(){showModal('Importar assinatura recebida',`<p>Selecione o arquivo JSON que o cliente devolveu após assinar.</p><input type="file" accept="application/json,.json" id="proofFile"><p><button onclick="loadProof()">Importar comprovante</button></p><div class="notice">A importação não valida identidade, integridade criptográfica ou autoria da assinatura.</div>`)}
async function loadProof(){let f=document.getElementById('proofFile').files[0];if(!f)return alert('Selecione o arquivo.');try{let p=JSON.parse(await f.text());let c=db.contracts.find(x=>x.id===p.contractId);if(!c||!p.signature?.startsWith('data:image/png;base64,')||!p.signer||!p.signedAt)throw Error('Arquivo inválido ou contrato não encontrado');c.signatureProof=p;c.status='Assinado';if(c.type==='Mensal'&&p.day)c.day=p.day;closeModal();save();alert('Assinatura demonstrativa registrada no contrato.')}catch(e){alert(e.message)}}
function addSignActions(){let section=document.getElementById('view');if(tab!=='Contratos'||!section)return;let bar=document.createElement('div');bar.className='actions';bar.style.margin='10px 0';bar.innerHTML='<button class="secondary" onclick="importProof()">Importar assinatura do cliente</button>';section.prepend(bar);db.contracts.forEach(c=>{let items=[...section.querySelectorAll('.item')];let row=items.find(el=>el.textContent.includes(c.service)&&el.textContent.includes(nameFor(c.client)));if(row){let b=document.createElement('button');b.textContent=c.signatureProof?'✓ Assinado':'Enviar para assinatura';b.className='secondary';b.onclick=()=>c.signatureProof?showModal('Comprovante',`<div class="signed">Assinado por ${esc(c.signatureProof.signer)} em ${esc(new Date(c.signatureProof.signedAt).toLocaleString('pt-BR'))}</div><img style="max-width:100%" src="${c.signatureProof.signature}">`):sendSign(c.id);row.append(b)}})}
const oldRender=render;render=function(){oldRender();addSignActions()};window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#assinar='))clientSignPage()});if(location.hash.startsWith('#assinar='))clientSignPage();

render();</script></body></html>
